services:
  admin:
    build: .
    container_name: positron-admin
    ports:
      - "3000:3000"
    volumes:
      - db-data:/data
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=file:/data/positron.db
      - DEPLOYMENT_MODE=self-hosted
    restart: unless-stopped

volumes:
  db-data:
