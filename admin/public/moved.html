<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Positron Today Admin — Moved</title>
  <link rel="icon" href="/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fffbeb;
      color: #451a03;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
      position: relative;
    }

    /* Watermark */
    .page-watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -44%);
      width: 680px;
      height: 680px;
      opacity: 0.10;
      pointer-events: none;
      z-index: 0;
    }

    /* Nav */
    nav {
      background: #facc15;
      padding: 0.65rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem 1rem;
      position: relative;
      z-index: 1;
    }
    nav .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      color: #78350f;
    }

    /* Main */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 120px);
    }

    /* Card */
    .card {
      max-width: 520px;
      background: #fff;
      border: 2px solid #fde68a;
      border-radius: 1rem;
      padding: 2.5rem;
      text-align: center;
    }
    .card-icon {
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #78350f;
      margin-bottom: 1rem;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.75;
      color: #451a03;
    }
    .site-link {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1.25rem;
      background: #facc15;
      color: #78350f;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      border-radius: 0.5rem;
      transition: background 0.15s;
    }
    .site-link:hover { background: #fbbf24; }

    /* Footer */
    footer {
      text-align: center;
      padding: 1.5rem 1rem;
      font-size: 0.75rem;
      color: #92400e;
      position: relative;
      z-index: 1;
    }

    @media (min-width: 640px) {
      nav { padding: 0.75rem 1.5rem; }
      nav .brand { font-size: 1.25rem; }
      nav .brand svg { width: 38px; height: 38px; }
      main { padding: 2.5rem 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="page-watermark" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
      <ellipse cx="50" cy="50" rx="47" ry="16" fill="none" stroke="#78350f" stroke-width="4"/>
      <ellipse cx="50" cy="50" rx="47" ry="16" fill="none" stroke="#78350f" stroke-width="4" transform="rotate(60 50 50)"/>
      <ellipse cx="50" cy="50" rx="47" ry="16" fill="none" stroke="#78350f" stroke-width="4" transform="rotate(120 50 50)"/>
      <circle cx="50" cy="50" r="13" fill="#78350f"/>
      <rect x="43.5" y="47" width="13" height="6" rx="2" fill="#fffbeb"/>
      <rect x="47" y="43.5" width="6" height="13" rx="2" fill="#fffbeb"/>
    </svg>
  </div>

  <nav>
    <a href="https://positron.today" class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32" aria-hidden="true">
        <ellipse cx="50" cy="50" rx="46" ry="16" fill="none" stroke="#f59e0b" stroke-width="5"/>
        <ellipse cx="50" cy="50" rx="46" ry="16" fill="none" stroke="#f59e0b" stroke-width="5" transform="rotate(60 50 50)"/>
        <ellipse cx="50" cy="50" rx="46" ry="16" fill="none" stroke="#f59e0b" stroke-width="5" transform="rotate(120 50 50)"/>
        <circle cx="50" cy="50" r="13" fill="#f59e0b"/>
        <rect x="43.5" y="47" width="13" height="6" rx="2" fill="white" opacity="0.95"/>
        <rect x="47" y="43.5" width="6" height="13" rx="2" fill="white" opacity="0.95"/>
      </svg>
      Positron Today
    </a>
  </nav>

  <main>
    <div class="card">
      <div class="card-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64" aria-hidden="true">
          <ellipse cx="50" cy="50" rx="46" ry="16" fill="none" stroke="#fbbf24" stroke-width="5"/>
          <ellipse cx="50" cy="50" rx="46" ry="16" fill="none" stroke="#fbbf24" stroke-width="5" transform="rotate(60 50 50)"/>
          <ellipse cx="50" cy="50" rx="46" ry="16" fill="none" stroke="#fbbf24" stroke-width="5" transform="rotate(120 50 50)"/>
          <circle cx="50" cy="50" r="13" fill="#fbbf24"/>
          <rect x="43.5" y="47" width="13" height="6" rx="2" fill="white" opacity="0.95"/>
          <rect x="47" y="43.5" width="6" height="13" rx="2" fill="white" opacity="0.95"/>
        </svg>
      </div>
      <h1>Admin has moved</h1>
      <p>The Positron Today admin application is no longer hosted here. It has been migrated to private server infrastructure.</p>
      <a href="https://positron.today" class="site-link">Visit Positron Today &rarr;</a>
    </div>
  </main>

  <footer>
    Positron Today &nbsp;&middot;&nbsp; positive news, every day
  </footer>

</body>
</html>
